{% extends "core/base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<form method="post" class="panel" style="max-width:360px;margin:60px auto">
  {% csrf_token %}
  <h1 style="margin-bottom:16px">Стройконтроль</h1>
  {% if form.errors %}<ul class="errorlist" style="margin-bottom:12px"><li>Неверный логин или пароль.</li></ul>{% endif %}
  <div class="field" style="margin-bottom:12px">
    <label for="id_username">Логин</label>
    <input type="text" name="username" id="id_username" autofocus required style="width:100%">
  </div>
  <div class="field" style="margin-bottom:16px">
    <label for="id_password">Пароль</label>
    <input type="password" name="password" id="id_password" required style="width:100%">
  </div>
  <input type="hidden" name="next" value="{{ next }}">
  <button class="btn btn-primary" type="submit" style="width:100%">Войти</button>
</form>
{% endblock %}
